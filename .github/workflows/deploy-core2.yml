name: Deploy Core2 web apps

on:
  push:
    branches: [main]
    paths:
      - "web/ps-eye/**"
      - "tests/test_ps_eye_websocket.py"
      - ".github/workflows/deploy-core2.yml"
  workflow_dispatch:

concurrency:
  group: ps-eye-core2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, core2-runner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PS Eye web apps
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/actions-monitor-core2/tests/actions-monitor-scrape"
          TARGET="$BASE/ps-eye"
          TMP="$BASE/.ps-eye.deploy.$$"
          PREV="$BASE/.ps-eye.previous"

          test -d "$BASE"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp -a web/ps-eye/. "$TMP/"

          test -f "$TMP/index.html"
          test -f "$TMP/nearfield/index.html"
          test -f "$TMP/ps-eye-nearfield-factory.js"

          rm -rf "$PREV"
          if [ -d "$TARGET" ]; then mv "$TARGET" "$PREV"; fi
          mv "$TMP" "$TARGET"
          echo "DEPLOYED_TO=$TARGET"

      - name: Local static and near-field browser self-test
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/ps-eye/nearfield/ | grep -F "Near-field 2D SRP-PHAT + Heatmap"
          curl -fsS http://127.0.0.1:8000/ps-eye/ps-eye-nearfield-factory.js | grep -F "PsEyeNearfieldFactory"

          ROOT="$HOME/.local/share/core2-playwright"
          if [ -x "$ROOT/bin/python" ]; then
            "$ROOT/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1000,"height":800})
              page.goto("http://127.0.0.1:8000/ps-eye/nearfield/?selftest=1",
                        wait_until="domcontentloaded", timeout=30000)
              ready=page.locator("html").get_attribute("data-nearfield-ready")
              result=page.locator("html").get_attribute("data-nearfield-selftest")
              print("NEARFIELD_READY=", ready)
              print("NEARFIELD_SELFTEST=", result)
              print(page.locator("#log").inner_text())
              assert ready == "true"
              assert result == "pass"
              browser.close()
          PY
          else
            echo "PLAYWRIGHT_SKIPPED"
          fi

      - name: Verify local A/B PCM
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_ps_eye_websocket.py ws://127.0.0.1:8000/ps-eye/a/ws --origin http://127.0.0.1:8000
          python3 tests/test_ps_eye_websocket.py ws://127.0.0.1:8000/ps-eye/b/ws --origin http://127.0.0.1:8000

      - name: Verify public HTTPS and WSS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://core2.lp.dtop.jp/ps-eye/nearfield/ | grep -F "Near-field 2D SRP-PHAT + Heatmap"
          curl -fsS https://core2.lp.dtop.jp/ps-eye/ps-eye-nearfield-factory.js | grep -F "PsEyeNearfieldFactory"
          python3 tests/test_ps_eye_websocket.py wss://core2.lp.dtop.jp/ps-eye/a/ws --origin https://core2.lp.dtop.jp
          python3 tests/test_ps_eye_websocket.py wss://core2.lp.dtop.jp/ps-eye/b/ws --origin https://core2.lp.dtop.jp
          echo "CORE2_NEARFIELD_DEPLOY_OK"
